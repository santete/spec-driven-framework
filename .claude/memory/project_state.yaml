decisions:
  - date: '2026-06-05'
    decision: "No async migration — CLI sync, Claude Code subagents do LLM work"
    reason: "Avoids 25-file breaking change. blocked→resume pattern sufficient."
    impact: "S5/S6 return 'blocked' when outputs missing, Claude launches subagents"
  - date: '2026-06-05'
    decision: "Bootstrap mode for deterministic testing (VITEST=true)"
    reason: "Tests need reproducible output. LLM output non-deterministic."
    impact: "Two code paths in S5/S6: bootstrap (templates) vs validate (LLM outputs)"
  - date: '2026-06-05'
    decision: "G7 drift = warn not fail within same run"
    reason: "Bootstrap templates may overwrite files with different spec versions"
    impact: "G7 only hard-fails on cross-run drift"

